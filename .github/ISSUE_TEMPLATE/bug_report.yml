name: Bug report
description: Report something that isn't working as intended
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run `aca ...`, the agent ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or a snippet that triggers the issue.
      placeholder: |
        1. `aca service start`
        2. `aca chat` and send "..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traces
      description: Output of `aca logs`, tracebacks, or console output. Automatically formatted as code.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release version.
    validations:
      required: false
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.12"
        - "3.13"
        - other (note it in the description)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 / WSL2 / macOS 14
    validations:
      required: false
