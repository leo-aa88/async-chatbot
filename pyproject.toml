[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aca"
version = "0.6.15"
description = "Asynchronous Conversational Agent — a persistent, introspective conversational agent."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Leonardo Araujo" }]
dependencies = []

[project.optional-dependencies]
# Real LLM providers (OpenAI / Anthropic / Grok / Gemini) need an async HTTP client.
llm = ["httpx>=0.27"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.7", "httpx>=0.27"]

[project.scripts]
aca = "aca.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: the `class X(str, Enum)` idiom is intentional — enum values persist as strings in
# SQLite and travel over IPC; we rely on `.value` rather than StrEnum's implicit str().
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests use compact multi-statement setup lines for readability.
"tests/*" = ["E702"]
